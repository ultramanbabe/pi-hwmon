# Skip the daily restart when the PC is unreachable: Chromium's network error
# page has no JS to retry, so restarting into a dead server parks the panel
# on it until someone intervenes. Non-zero ExecCondition skips cleanly.
[Service]
ExecCondition=/usr/bin/timeout 3 /usr/bin/bash -c "exec 3<>/dev/tcp/192.168.1.20/8765"
